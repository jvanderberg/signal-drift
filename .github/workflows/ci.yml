name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install build tools for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev libusb-1.0-0-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_build_from_source: true

      - name: Build native modules from source
        run: npm rebuild better-sqlite3 serialport usb --build-from-source

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install build tools for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev libusb-1.0-0-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_build_from_source: true

      - name: Build native modules from source
        run: npm rebuild better-sqlite3 serialport usb --build-from-source

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run server tests
        run: npx vitest run

      - name: Run client tests
        run: cd client && npm run test:run

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install build tools for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev libusb-1.0-0-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_build_from_source: true

      - name: Build native modules from source
        run: npm rebuild better-sqlite3 serialport usb --build-from-source

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7
